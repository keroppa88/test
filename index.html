<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サバンナドライブ</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #87b5d4; font-family: sans-serif; }
  #info {
    position: fixed; top: 10px; left: 10px; color: #fff;
    text-shadow: 0 1px 2px #000; font-size: 14px; line-height: 1.5;
    pointer-events: none; z-index: 10;
  }
  #speed {
    position: fixed; bottom: 14px; right: 16px; color: #fff;
    text-shadow: 0 1px 2px #000; font-size: 22px; font-weight: bold; z-index: 10;
  }
  #hint {
    position: fixed; bottom: 14px; left: 16px; color: #fff;
    text-shadow: 0 1px 2px #000; font-size: 13px; z-index: 10;
  }
</style>
</head>
<body>
<div id="info">サバンナ 3D ドライブ<br>草原・砂・木・林・水がランダム生成</div>
<div id="speed">0 km/h</div>
<div id="hint">W/↑:前進  S/↓:後退  A/←・D/→:ステア</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ---------- 基本セットアップ ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec8e8);
scene.fog = new THREE.Fog(0x9ec8e8, 120, 480);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ---------- ライト ----------
const sun = new THREE.DirectionalLight(0xfff4e0, 1.1);
sun.position.set(120, 200, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 600;
const s = 160;
sun.shadow.camera.left = -s; sun.shadow.camera.right = s;
sun.shadow.camera.top = s; sun.shadow.camera.bottom = -s;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x6b7c3a, 0.6));

// ---------- 地形生成 ----------
const WORLD = 600;          // ワールドの一辺(m)
const SEG = 200;            // メッシュ分割数
const WATER_LEVEL = -1.5;

// 簡易な決定論的擬似乱数 (value noise)
function hash(x, z) {
  let n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
  return n - Math.floor(n);
}
function smooth(t) { return t * t * (3 - 2 * t); }
function valueNoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z);
  const xf = x - xi, zf = z - zi;
  const a = hash(xi, zi), b = hash(xi + 1, zi);
  const c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  const u = smooth(xf), v = smooth(zf);
  return THREE.MathUtils.lerp(THREE.MathUtils.lerp(a, b, u), THREE.MathUtils.lerp(c, d, u), v);
}
// 複数オクターブで高低差を作る
function heightAt(x, z) {
  const fx = x * 0.012, fz = z * 0.012;
  let h = 0;
  h += valueNoise(fx, fz) * 18;
  h += valueNoise(fx * 2.3, fz * 2.3) * 7;
  h += valueNoise(fx * 5.1, fz * 5.1) * 2.5;
  return h - 12;  // 全体を下げて水域を作る
}
// 湿度(バイオーム決定用)
function moistureAt(x, z) {
  return valueNoise(x * 0.006 + 50, z * 0.006 + 50);
}

// バイオームごとの色
const COL_GRASS = new THREE.Color(0x6f8f3a);
const COL_DRYGRASS = new THREE.Color(0x9fa84e);
const COL_SAND = new THREE.Color(0xd9c48a);
const COL_FOREST = new THREE.Color(0x49682b);
const COL_WET = new THREE.Color(0x5d7d3f);

function biomeColor(x, z, h) {
  const m = moistureAt(x, z);
  const c = new THREE.Color();
  if (h < WATER_LEVEL + 1.2) {
    c.copy(COL_SAND);                 // 水際は砂浜
  } else if (m < 0.32) {
    c.copy(COL_SAND).lerp(COL_DRYGRASS, smooth(m / 0.32)); // 砂～乾草
  } else if (m < 0.55) {
    c.copy(COL_DRYGRASS).lerp(COL_GRASS, smooth((m - 0.32) / 0.23));
  } else if (m < 0.72) {
    c.copy(COL_GRASS).lerp(COL_WET, smooth((m - 0.55) / 0.17));
  } else {
    c.copy(COL_WET).lerp(COL_FOREST, smooth((m - 0.72) / 0.28)); // 林
  }
  // 標高で軽く陰影
  c.multiplyScalar(0.85 + Math.min(h, 20) / 60);
  return c;
}

const geo = new THREE.PlaneGeometry(WORLD, WORLD, SEG, SEG);
geo.rotateX(-Math.PI / 2);
const pos = geo.attributes.position;
const colors = [];
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const h = heightAt(x, z);
  pos.setY(i, h);
  const c = biomeColor(x, z, h);
  colors.push(c.r, c.g, c.b);
}
geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
geo.computeVertexNormals();
const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
ground.receiveShadow = true;
scene.add(ground);

// ---------- 水面 ----------
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD, WORLD),
  new THREE.MeshStandardMaterial({ color: 0x2f7fb5, transparent: true, opacity: 0.78, roughness: 0.2, metalness: 0.1 })
);
water.rotation.x = -Math.PI / 2;
water.position.y = WATER_LEVEL;
scene.add(water);

// ---------- 木 (インスタンス化) ----------
function makeTrees() {
  const trunkGeo = new THREE.CylinderGeometry(0.25, 0.45, 4, 6);
  trunkGeo.translate(0, 2, 0);
  const leafGeo = new THREE.SphereGeometry(2.6, 7, 6);
  leafGeo.scale(1, 0.7, 1);
  leafGeo.translate(0, 5, 0);

  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 1 });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f5d27, roughness: 1 });

  const MAX = 1400;
  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, MAX);
  const leaves = new THREE.InstancedMesh(leafGeo, leafMat, MAX);
  trunks.castShadow = leaves.castShadow = true;
  const dummy = new THREE.Object3D();
  let n = 0;
  for (let i = 0; i < MAX * 4 && n < MAX; i++) {
    const x = (Math.random() - 0.5) * (WORLD - 20);
    const z = (Math.random() - 0.5) * (WORLD - 20);
    const h = heightAt(x, z);
    const m = moistureAt(x, z);
    if (h < WATER_LEVEL + 1.5) continue;           // 水中・水際は不可
    // 林(湿度高)では密に、乾燥地ではまばらに
    const density = m > 0.7 ? 0.9 : m > 0.5 ? 0.4 : m > 0.35 ? 0.12 : 0.02;
    if (Math.random() > density) continue;
    const sc = 0.7 + Math.random() * 0.9;
    dummy.position.set(x, h, z);
    dummy.rotation.y = Math.random() * Math.PI * 2;
    dummy.scale.set(sc, sc, sc);
    dummy.updateMatrix();
    trunks.setMatrixAt(n, dummy.matrix);
    leaves.setMatrixAt(n, dummy.matrix);
    n++;
  }
  trunks.count = leaves.count = n;
  scene.add(trunks, leaves);
}
makeTrees();

// ---------- 車 ----------
const car = new THREE.Group();
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xcc4422, roughness: 0.5, metalness: 0.3 });
const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.8, 4), bodyMat);
body.position.y = 0.9; body.castShadow = true;
const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.7, 2),
  new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.3 }));
cabin.position.set(0, 1.55, -0.2); cabin.castShadow = true;
car.add(body, cabin);
const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 12);
wheelGeo.rotateZ(Math.PI / 2);
const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
for (const [wx, wz] of [[-1, 1.3], [1, 1.3], [-1, -1.3], [1, -1.3]]) {
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.position.set(wx, 0.5, wz); w.castShadow = true;
  car.add(w);
}
scene.add(car);

// ---------- 車の物理 ----------
const carState = {
  x: 0, z: 0, heading: 0, speed: 0,
};
// 初期位置を乾いた陸地に
(function placeCar() {
  for (let i = 0; i < 200; i++) {
    const x = (Math.random() - 0.5) * 200;
    const z = (Math.random() - 0.5) * 200;
    if (heightAt(x, z) > WATER_LEVEL + 3) { carState.x = x; carState.z = z; break; }
  }
})();

const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup', e => { keys[e.code] = false; });

function terrainNormal(x, z) {
  const e = 1.0;
  const hL = heightAt(x - e, z), hR = heightAt(x + e, z);
  const hD = heightAt(x, z - e), hU = heightAt(x, z + e);
  return new THREE.Vector3(hL - hR, 2 * e, hD - hU).normalize();
}

const clock = new THREE.Clock();
function update(dt) {
  const accel = 26, maxSpeed = 34, reverseMax = -12;
  const fwd = keys['KeyW'] || keys['ArrowUp'];
  const back = keys['KeyS'] || keys['ArrowDown'];
  const left = keys['KeyA'] || keys['ArrowLeft'];
  const right = keys['KeyD'] || keys['ArrowRight'];

  if (fwd) carState.speed += accel * dt;
  else if (back) carState.speed -= accel * dt;
  else carState.speed *= (1 - 1.5 * dt);       // 惰性減速
  carState.speed = THREE.MathUtils.clamp(carState.speed, reverseMax, maxSpeed);
  if (Math.abs(carState.speed) < 0.05) carState.speed = 0;

  // ステアは速度に応じて効く
  const steer = (left ? 1 : 0) - (right ? 1 : 0);
  carState.heading += steer * 1.6 * dt * THREE.MathUtils.clamp(carState.speed / 8, -1, 1);

  // 移動
  const nx = carState.x - Math.sin(carState.heading) * carState.speed * dt;
  const nz = carState.z - Math.cos(carState.heading) * carState.speed * dt;
  // 水に入ると重く沈む(減速)
  const nh = heightAt(nx, nz);
  if (nh < WATER_LEVEL) carState.speed *= 0.9;
  // ワールド端で止める
  const lim = WORLD / 2 - 8;
  carState.x = THREE.MathUtils.clamp(nx, -lim, lim);
  carState.z = THREE.MathUtils.clamp(nz, -lim, lim);

  // 車を地形に追従
  const gy = heightAt(carState.x, carState.z);
  const n = terrainNormal(carState.x, carState.z);
  car.position.set(carState.x, gy, carState.z);
  // 向き + 地形の傾き
  const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 1, 0), n);
  const headingQ = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), carState.heading);
  car.quaternion.copy(q).multiply(headingQ);

  // 主観視点カメラ (運転席)
  const eye = new THREE.Vector3(0, 1.7, -0.1).applyQuaternion(car.quaternion).add(car.position);
  const look = new THREE.Vector3(0, 1.4, -10).applyQuaternion(car.quaternion).add(car.position);
  camera.position.lerp(eye, 0.4);
  camera.lookAt(look);

  // 太陽を車に追従させて影を維持
  sun.position.set(carState.x + 120, 200, carState.z + 80);
  sun.target.position.set(carState.x, 0, carState.z);
  sun.target.updateMatrixWorld();

  document.getElementById('speed').textContent =
    Math.round(Math.abs(carState.speed) * 3.6) + ' km/h';
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  water.position.set(carState.x, WATER_LEVEL + Math.sin(performance.now() * 0.001) * 0.05, carState.z);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
