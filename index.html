<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サバンナ・ハント</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #87b5d4; font-family: sans-serif; }
  #info {
    position: fixed; top: 10px; left: 10px; color: #fff;
    text-shadow: 0 1px 2px #000; font-size: 14px; line-height: 1.5;
    pointer-events: none; z-index: 10;
  }
  #status {
    position: fixed; top: 10px; right: 14px; text-align: right;
    text-shadow: 0 1px 2px #000; font-size: 16px; font-weight: bold; z-index: 10;
  }
  #hint {
    position: fixed; bottom: 14px; left: 16px; color: #fff;
    text-shadow: 0 1px 2px #000; font-size: 13px; z-index: 10;
  }
  /* HPバー */
  #hpwrap {
    position: fixed; bottom: 16px; right: 16px; width: 200px; height: 16px;
    border: 2px solid #fff; background: rgba(0,0,0,.4); z-index: 10;
  }
  #hpbar { height: 100%; width: 100%; background: #43c44a; transition: width .1s; }
  /* ライフルのクールダウン */
  #rifle {
    position: fixed; bottom: 40px; right: 16px; color: #fff;
    text-shadow: 0 1px 2px #000; font-size: 14px; z-index: 10;
  }
  /* クロスヘア */
  #cross {
    position: fixed; left: 50%; top: 50%; width: 22px; height: 22px;
    transform: translate(-50%,-50%); z-index: 10; pointer-events: none;
  }
  #cross::before, #cross::after {
    content: ''; position: absolute; background: rgba(255,255,255,.85);
    box-shadow: 0 0 2px #000;
  }
  #cross::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #cross::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  /* スコープ表示（覗いている時のみ） */
  #scope {
    position: fixed; inset: 0; display: none; z-index: 11; pointer-events: none;
    background:
      radial-gradient(circle at center, transparent 0 38vh, rgba(0,0,0,.97) 38.4vh);
  }
  #scope::before, #scope::after {
    content: ''; position: absolute; left: 50%; top: 50%; background: rgba(20,20,20,.9);
  }
  #scope::before { width: 76vh; height: 2px; transform: translate(-50%,-50%); }
  #scope::after { height: 76vh; width: 2px; transform: translate(-50%,-50%); }
  #scopedot {
    position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; border-radius: 50%;
    background: #e02020; transform: translate(-50%,-50%); z-index: 12;
    display: none; pointer-events: none; box-shadow: 0 0 4px #000;
  }
  /* メニュー */
  #menu {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,.45); z-index: 15;
  }
  #menu .box {
    background: rgba(20,24,20,.92); border: 2px solid #cdd6c0; padding: 24px 32px;
    color: #fff; min-width: 280px; text-shadow: 0 1px 2px #000;
  }
  #menu h2 { margin: 0 0 14px; }
  #menu .item {
    padding: 10px 14px; font-size: 16px; cursor: pointer; border: 1px solid transparent;
  }
  #menu .item.selected { background: rgba(255,255,255,.18); border-color: #fff; }
  #menu .mtip { font-size: 12px; opacity: .7; margin: 14px 0 0; }
  /* 被弾フラッシュ */
  #hurt {
    position: fixed; inset: 0; background: radial-gradient(transparent 40%, rgba(180,0,0,.55));
    opacity: 0; pointer-events: none; z-index: 9; transition: opacity .15s;
  }
  /* 終了オーバーレイ */
  #over {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; color: #fff; background: rgba(0,0,0,.6); z-index: 20;
    text-shadow: 0 2px 4px #000;
  }
  #over h1 { font-size: 48px; margin: 0 0 8px; }
  #over p { font-size: 16px; }
</style>
</head>
<body>
<div id="info">サバンナ・ハント<br>このエリアに潜む敵を仕留めろ</div>
<div id="status">敵: 捜索中</div>
<div id="rifle">ライフル: 装填完了</div>
<div id="hpwrap"><div id="hpbar"></div></div>
<div id="cross"></div>
<div id="scope"></div>
<div id="scopedot"></div>
<div id="menu">
  <div class="box">
    <h2>メニュー</h2>
    <div class="item selected" data-action="rifle">ライフル（スコープを覗く）</div>
    <div class="item" data-action="close">閉じる</div>
    <p class="mtip">↑↓/W S で選択 ・ Enter で決定 ・ P で閉じる</p>
  </div>
</div>
<div id="hurt"></div>
<div id="over"><h1></h1><p>クリックでリスタート</p></div>
<div id="hint">クリックで視点固定 ｜ マウス:視点 W/S:前後 A/D:旋回 Shift:走る ｜ P:メニュー ｜ スコープ中:Enter発砲(20秒/発) I/K:ズーム</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ---------- 基本セットアップ ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9ec8e8);
scene.fog = new THREE.Fog(0x9ec8e8, 120, 480);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

// ---------- ライト ----------
const sun = new THREE.DirectionalLight(0xfff4e0, 1.1);
sun.position.set(120, 200, 80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 600;
const s = 160;
sun.shadow.camera.left = -s; sun.shadow.camera.right = s;
sun.shadow.camera.top = s; sun.shadow.camera.bottom = -s;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfe3ff, 0x6b7c3a, 0.6));

// ---------- 地形生成 ----------
const WORLD = 600;          // ワールドの一辺(m)
const SEG = 200;            // メッシュ分割数
const WATER_LEVEL = -1.5;

// 簡易な決定論的擬似乱数 (value noise)
function hash(x, z) {
  let n = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
  return n - Math.floor(n);
}
function smooth(t) { return t * t * (3 - 2 * t); }
function valueNoise(x, z) {
  const xi = Math.floor(x), zi = Math.floor(z);
  const xf = x - xi, zf = z - zi;
  const a = hash(xi, zi), b = hash(xi + 1, zi);
  const c = hash(xi, zi + 1), d = hash(xi + 1, zi + 1);
  const u = smooth(xf), v = smooth(zf);
  return THREE.MathUtils.lerp(THREE.MathUtils.lerp(a, b, u), THREE.MathUtils.lerp(c, d, u), v);
}
// 複数オクターブで高低差を作る
function heightAt(x, z) {
  const fx = x * 0.012, fz = z * 0.012;
  let h = 0;
  h += valueNoise(fx, fz) * 18;
  h += valueNoise(fx * 2.3, fz * 2.3) * 7;
  h += valueNoise(fx * 5.1, fz * 5.1) * 2.5;
  return h - 12;  // 全体を下げて水域を作る
}
// 湿度(バイオーム決定用)
function moistureAt(x, z) {
  return valueNoise(x * 0.006 + 50, z * 0.006 + 50);
}

// バイオームごとの色
const COL_GRASS = new THREE.Color(0x6f8f3a);
const COL_DRYGRASS = new THREE.Color(0x9fa84e);
const COL_SAND = new THREE.Color(0xd9c48a);
const COL_FOREST = new THREE.Color(0x49682b);
const COL_WET = new THREE.Color(0x5d7d3f);

function biomeColor(x, z, h) {
  const m = moistureAt(x, z);
  const c = new THREE.Color();
  if (h < WATER_LEVEL + 1.2) {
    c.copy(COL_SAND);                 // 水際は砂浜
  } else if (m < 0.32) {
    c.copy(COL_SAND).lerp(COL_DRYGRASS, smooth(m / 0.32)); // 砂～乾草
  } else if (m < 0.55) {
    c.copy(COL_DRYGRASS).lerp(COL_GRASS, smooth((m - 0.32) / 0.23));
  } else if (m < 0.72) {
    c.copy(COL_GRASS).lerp(COL_WET, smooth((m - 0.55) / 0.17));
  } else {
    c.copy(COL_WET).lerp(COL_FOREST, smooth((m - 0.72) / 0.28)); // 林
  }
  // 標高で軽く陰影
  c.multiplyScalar(0.85 + Math.min(h, 20) / 60);
  return c;
}

const geo = new THREE.PlaneGeometry(WORLD, WORLD, SEG, SEG);
geo.rotateX(-Math.PI / 2);
const pos = geo.attributes.position;
const colors = [];
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const h = heightAt(x, z);
  pos.setY(i, h);
  const c = biomeColor(x, z, h);
  colors.push(c.r, c.g, c.b);
}
geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
geo.computeVertexNormals();
const ground = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 1 }));
ground.receiveShadow = true;
scene.add(ground);

// ---------- 水面 ----------
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(WORLD, WORLD),
  new THREE.MeshStandardMaterial({ color: 0x2f7fb5, transparent: true, opacity: 0.78, roughness: 0.2, metalness: 0.1 })
);
water.rotation.x = -Math.PI / 2;
water.position.y = WATER_LEVEL;
scene.add(water);

// ---------- 木 (インスタンス化) ----------
function makeTrees() {
  const trunkGeo = new THREE.CylinderGeometry(0.25, 0.45, 4, 6);
  trunkGeo.translate(0, 2, 0);
  const leafGeo = new THREE.SphereGeometry(2.6, 7, 6);
  leafGeo.scale(1, 0.7, 1);
  leafGeo.translate(0, 5, 0);

  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x6b4a2b, roughness: 1 });
  const leafMat = new THREE.MeshStandardMaterial({ color: 0x3f5d27, roughness: 1 });

  const MAX = 1400;
  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, MAX);
  const leaves = new THREE.InstancedMesh(leafGeo, leafMat, MAX);
  trunks.castShadow = leaves.castShadow = true;
  const dummy = new THREE.Object3D();
  let n = 0;
  for (let i = 0; i < MAX * 4 && n < MAX; i++) {
    const x = (Math.random() - 0.5) * (WORLD - 20);
    const z = (Math.random() - 0.5) * (WORLD - 20);
    const h = heightAt(x, z);
    const m = moistureAt(x, z);
    if (h < WATER_LEVEL + 1.5) continue;           // 水中・水際は不可
    // 林(湿度高)では密に、乾燥地ではまばらに
    const density = m > 0.7 ? 0.9 : m > 0.5 ? 0.4 : m > 0.35 ? 0.12 : 0.02;
    if (Math.random() > density) continue;
    const sc = 0.7 + Math.random() * 0.9;
    dummy.position.set(x, h, z);
    dummy.rotation.y = Math.random() * Math.PI * 2;
    dummy.scale.set(sc, sc, sc);
    dummy.updateMatrix();
    trunks.setMatrixAt(n, dummy.matrix);
    leaves.setMatrixAt(n, dummy.matrix);
    n++;
  }
  trunks.count = leaves.count = n;
  scene.add(trunks, leaves);
}
makeTrees();

// ---------- プレイヤー (徒歩・主観視点。座標と向きのみ管理) ----------
const player = {
  x: 0, z: 0, heading: 0, pitch: 0, speed: 0, hp: 100, alive: true,
};
(function placePlayer() {
  for (let i = 0; i < 300; i++) {
    const x = (Math.random() - 0.5) * 240;
    const z = (Math.random() - 0.5) * 240;
    if (heightAt(x, z) > WATER_LEVEL + 3) { player.x = x; player.z = z; break; }
  }
})();

const keys = {};
// モード: 'normal'（通常）/ 'scope'（スコープを覗く）
let mode = 'normal';
let menuOpen = false;
let scopeFov = 18;                 // スコープ時の視野角（小さいほど拡大）
const NORMAL_FOV = 70;
const menuEl = document.getElementById('menu');
const menuItems = [...menuEl.querySelectorAll('.item')];
let menuIndex = 0;

function refreshMenu() {
  menuItems.forEach((el, i) => el.classList.toggle('selected', i === menuIndex));
}
function openMenu() { menuOpen = true; menuIndex = 0; refreshMenu(); menuEl.style.display = 'flex'; document.exitPointerLock(); }
function closeMenu() { menuOpen = false; menuEl.style.display = 'none'; }
function chooseMenu() {
  const action = menuItems[menuIndex].dataset.action;
  closeMenu();
  if (action === 'rifle') mode = 'scope';       // スコープモードへ
}
menuItems.forEach((el, i) => el.addEventListener('mousedown', ev => {
  ev.stopPropagation(); menuIndex = i; refreshMenu(); chooseMenu();
}));

addEventListener('keydown', e => {
  keys[e.code] = true;
  sfx.unlock();
  if (overlayActive) return;
  if (e.code === 'KeyP') {                       // メニューの開閉
    if (menuOpen) closeMenu(); else openMenu();
    e.preventDefault(); return;
  }
  if (menuOpen) {                                // メニュー操作
    if (e.code === 'ArrowUp' || e.code === 'KeyW') { menuIndex = (menuIndex + menuItems.length - 1) % menuItems.length; refreshMenu(); }
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') { menuIndex = (menuIndex + 1) % menuItems.length; refreshMenu(); }
    else if (e.code === 'Enter') chooseMenu();
    e.preventDefault(); return;
  }
  if (mode === 'scope') {
    if (e.code === 'Enter') { fire(); e.preventDefault(); }
    if (e.code === 'Escape') mode = 'normal';
  }
});
addEventListener('keyup', e => { keys[e.code] = false; });

// ---------- マウスで視点移動（ポインターロック）----------
const canvas = renderer.domElement;
canvas.addEventListener('click', () => {
  if (!overlayActive && !menuOpen && document.pointerLockElement !== canvas) canvas.requestPointerLock();
});
addEventListener('mousemove', e => {
  if (document.pointerLockElement !== canvas) return;
  // スコープ時は感度を下げて精密に狙えるように
  const sens = (mode === 'scope' ? 0.0007 : 0.0022);
  player.heading -= e.movementX * sens;
  player.pitch -= e.movementY * sens;
  player.pitch = THREE.MathUtils.clamp(player.pitch, -Math.PI / 2 + 0.05, Math.PI / 2 - 0.05);
});

// ---------- 効果音 (sound/ フォルダの音声ファイルを使用) ----------
// 拡張子は自動判別 (mp3 / wav / ogg / m4a の順に試行)
const sfx = (() => {
  function load(name, { loop = false, volume = 1 } = {}) {
    const exts = ['mp3', 'wav', 'ogg', 'm4a'];
    const a = new Audio();
    a.loop = loop; a.volume = volume; a.preload = 'auto';
    let i = 0;
    const tryNext = () => { if (i < exts.length) a.src = `sound/${name}.${exts[i++]}`; };
    a.addEventListener('error', tryNext);
    tryNext();
    return a;
  }
  // ファイル名(拡張子なし): 必要に応じて変更してください
  const walk = load('walk', { loop: true, volume: 0.6 });   // 歩く音
  const run = load('run', { loop: true, volume: 0.7 });     // 走る音
  const rifle = load('rifle', { volume: 0.9 });             // ライフル狙撃音
  const hit = load('hit', { volume: 0.9 });                 // 命中音

  function play(a) { try { a.currentTime = 0; a.play(); } catch (e) {} }
  function unlock() { /* 任意のユーザー操作で再生可能になる */ }

  return {
    unlock,
    gunshot: () => play(rifle),
    hit: () => play(hit),
    // 移動音: 'walk' / 'run' / null を渡して切り替え
    foot(kind) {
      if (kind === 'walk') { if (run.paused === false) run.pause(); if (walk.paused) walk.play().catch(() => {}); }
      else if (kind === 'run') { if (walk.paused === false) walk.pause(); if (run.paused) run.play().catch(() => {}); }
      else { if (!walk.paused) walk.pause(); if (!run.paused) run.pause(); }
    },
  };
})();

// ---------- 敵 (ランダムで3種から1体) ----------
const ENEMY_KINDS = ['oni', 'giant', 'ghost'];
const enemyKind = ENEMY_KINDS[Math.floor(Math.random() * ENEMY_KINDS.length)];

function buildEnemyMesh(kind) {
  const g = new THREE.Group();
  if (kind === 'oni') {
    // 全身が赤い人間（鬼）
    const mat = new THREE.MeshStandardMaterial({ color: 0xcc1f1f, roughness: 0.7 });
    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.45, 1.0, 4, 8), mat);
    torso.position.y = 1.3;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 10), mat);
    head.position.y = 2.2;
    // 角
    const hornMat = new THREE.MeshStandardMaterial({ color: 0xf0e0c0 });
    for (const dx of [-0.16, 0.16]) {
      const horn = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.35, 6), hornMat);
      horn.position.set(dx, 2.5, 0);
      g.add(horn);
    }
    g.add(torso, head);
    g.userData = { eye: 1.9, scale: 1, radius: 0.6, fly: false };
  } else if (kind === 'giant') {
    // 大きな巨人
    const mat = new THREE.MeshStandardMaterial({ color: 0x6b5848, roughness: 0.9 });
    const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.9, 2.2, 4, 8), mat);
    torso.position.y = 2.6;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 10), mat);
    head.position.y = 4.4;
    for (const dx of [-1.1, 1.1]) {
      const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.32, 1.8, 4, 6), mat);
      arm.position.set(dx, 2.7, 0);
      g.add(arm);
    }
    g.add(torso, head);
    g.userData = { eye: 4.0, scale: 1.6, radius: 1.4, fly: false };
  } else {
    // 白い幽霊：空中浮遊する白い塊
    const mat = new THREE.MeshStandardMaterial({
      color: 0xffffff, emissive: 0xaad0ff, emissiveIntensity: 0.5,
      transparent: true, opacity: 0.7, roughness: 0.3,
    });
    const blob = new THREE.Mesh(new THREE.SphereGeometry(0.9, 16, 14), mat);
    blob.scale.set(1, 1.3, 1);
    blob.position.y = 0;
    // 下部をちぎれた塊風に
    for (let i = 0; i < 5; i++) {
      const lump = new THREE.Mesh(new THREE.SphereGeometry(0.3 + Math.random() * 0.2, 8, 8), mat);
      lump.position.set((Math.random() - 0.5), -1 - Math.random() * 0.6, (Math.random() - 0.5));
      g.add(lump);
    }
    g.add(blob);
    g.userData = { eye: 1.6, scale: 1.2, radius: 1.0, fly: true };
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  g.scale.setScalar(g.userData.scale);
  return g;
}

const enemyMesh = buildEnemyMesh(enemyKind);
scene.add(enemyMesh);

const enemyLabel = { oni: '赤い鬼', giant: '巨人', ghost: '白い幽霊' }[enemyKind];

const enemy = {
  x: 0, z: 0, heading: 0, hp: 100, alive: true,
  state: 'patrol',           // patrol / chase
  alertTimer: 0,             // 追跡継続時間
  target: { x: 0, z: 0 },    // 巡回先
  speed: 21 * 1.2,           // プレイヤーの走り(21)の1.2倍 = 25.2。逃げ切れない速さ
  sightRange: enemyKind === 'ghost' ? 50 : 70,
  hearRange: 160,
};
// プレイヤーから離れた場所にスポーン
(function placeEnemy() {
  for (let i = 0; i < 300; i++) {
    const x = (Math.random() - 0.5) * 360;
    const z = (Math.random() - 0.5) * 360;
    const d = Math.hypot(x - player.x, z - player.z);
    if (d > 90 && heightAt(x, z) > WATER_LEVEL + 2) { enemy.x = x; enemy.z = z; break; }
  }
  enemy.target.x = enemy.x; enemy.target.z = enemy.z;
})();

// ---------- ライフル ----------
const RIFLE_COOLDOWN = 20;   // 秒
let lastShot = -RIFLE_COOLDOWN;
const raycaster = new THREE.Raycaster();
let gameTime = 0;

function fire() {
  if (mode !== 'scope' || menuOpen) return;          // スコープを覗いている時だけ撃てる
  if (!player.alive || !enemy.alive) return;
  if (gameTime - lastShot < RIFLE_COOLDOWN) return;  // 装填中
  lastShot = gameTime;
  sfx.unlock();
  sfx.gunshot();
  // 発砲音で敵が必ず気づく(エリア内に響く)
  const dist = Math.hypot(enemy.x - player.x, enemy.z - player.z);
  if (dist < enemy.hearRange) alertEnemy();

  // 画面中央からレイを飛ばして命中判定
  raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
  const hits = raycaster.intersectObject(enemyMesh, true);
  if (hits.length) {
    enemy.hp -= 60;            // 2発で仕留められる威力
    sfx.hit();                 // 命中音
    flashEnemyHit();
    if (enemy.hp <= 0) { enemy.hp = 0; enemy.alive = false; endGame(true); }
  }
}
addEventListener('mousedown', () => {
  if (overlayActive) { restart(); return; }
  if (menuOpen) return;
  // ポインター未ロック時のクリックは視点固定のためだけに使う（誤射防止）
  if (document.pointerLockElement !== canvas) return;
  if (mode === 'scope') fire();                  // スコープ中はクリックでも発砲可
});

function flashEnemyHit() {
  enemyMesh.traverse(o => { if (o.isMesh && o.material.emissive) {
    const m = o.material; const prev = m.emissiveIntensity;
    m.emissive.setHex(0xff3030); m.emissiveIntensity = 1.2;
    setTimeout(() => { m.emissiveIntensity = prev; }, 120);
  }});
}

function alertEnemy() {
  enemy.state = 'chase';
  enemy.alertTimer = 12;       // 12秒は追跡継続
}

// ---------- ゲーム終了 ----------
let overlayActive = false;
function endGame(win) {
  overlayActive = true;
  const over = document.getElementById('over');
  over.querySelector('h1').textContent = win ? '討伐成功' : 'やられた…';
  over.querySelector('h1').style.color = win ? '#7fe08a' : '#ff6b6b';
  over.style.display = 'flex';
  document.exitPointerLock();
  sfx.foot(null);
}
function restart() { location.reload(); }

// ---------- HUD更新 ----------
const elStatus = document.getElementById('status');
const elRifle = document.getElementById('rifle');
const elHp = document.getElementById('hpbar');
const elHurt = document.getElementById('hurt');

// ---------- 視界判定（敵がプレイヤーを見つけるか）----------
function enemySeesPlayer() {
  const dx = player.x - enemy.x, dz = player.z - enemy.z;
  const dist = Math.hypot(dx, dz);
  if (dist > enemy.sightRange) return false;
  // 敵の向いている方向との角度（前方120°以内）。幽霊は全方位察知。
  if (enemyKind === 'ghost') return true;
  const toPlayer = Math.atan2(dx, dz);
  const diff = Math.abs(((toPlayer - enemy.heading + Math.PI) % (Math.PI * 2)) - Math.PI);
  return diff < Math.PI * 0.55;
}

const elScope = document.getElementById('scope');
const elScopeDot = document.getElementById('scopedot');
const elCross = document.getElementById('cross');

const clock = new THREE.Clock();
function update(dt) {
  gameTime += dt;

  // ===== スコープのズーム（I:拡大 / K:縮小）=====
  if (mode === 'scope' && !menuOpen) {
    if (keys['KeyI']) scopeFov = Math.max(6, scopeFov - 40 * dt);
    if (keys['KeyK']) scopeFov = Math.min(40, scopeFov + 40 * dt);
  }
  // 視野角を滑らかに切り替え
  const targetFov = mode === 'scope' ? scopeFov : NORMAL_FOV;
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 12);
  camera.updateProjectionMatrix();
  // 表示の出し分け
  elScope.style.display = mode === 'scope' ? 'block' : 'none';
  elScopeDot.style.display = mode === 'scope' ? 'block' : 'none';
  elCross.style.display = mode === 'scope' ? 'none' : 'block';

  // メニュー表示中はシミュレーションを止める（ポーズ）
  if (menuOpen) return;

  // ===== プレイヤー移動 =====
  // 速度: 歩き=旧7×1.4=9.8、走り=旧7×3=21（Shiftで走る）
  const WALK = 9.8, RUN = 21, BACK = 9.8 * 0.6;
  let moving = false, running = false;
  if (player.alive) {
    const fwd = keys['KeyW'] || keys['ArrowUp'];
    const back = keys['KeyS'] || keys['ArrowDown'];
    const left = keys['KeyA'] || keys['ArrowLeft'];
    const right = keys['KeyD'] || keys['ArrowRight'];
    running = keys['ShiftLeft'] || keys['ShiftRight'];
    // A/D でも旋回可（マウスと併用）
    player.heading += ((left ? 1 : 0) - (right ? 1 : 0)) * 1.8 * dt;

    let move = 0;
    if (fwd) move = running ? RUN : WALK;
    else if (back) move = -BACK;
    if (move !== 0) moving = true;
    const nx = player.x - Math.sin(player.heading) * move * dt;
    const nz = player.z - Math.cos(player.heading) * move * dt;
    // 深い水には入れない（足止め）
    if (heightAt(nx, nz) > WATER_LEVEL - 0.3) {
      const lim = WORLD / 2 - 8;
      player.x = THREE.MathUtils.clamp(nx, -lim, lim);
      player.z = THREE.MathUtils.clamp(nz, -lim, lim);
    }
  }
  // 足音（移動中のみ。走り/歩きで切り替え）
  sfx.foot(!player.alive || !moving ? null : (running ? 'run' : 'walk'));

  // 主観視点カメラ（直立・目線の高さ、マウスで上下左右）
  const gy = heightAt(player.x, player.z);
  const eyeH = gy + 1.7;
  camera.position.set(player.x, eyeH, player.z);
  camera.rotation.set(player.pitch, player.heading, 0, 'YXZ');

  // ===== 敵AI =====
  if (enemy.alive && player.alive) {
    // 索敵
    if (enemySeesPlayer()) alertEnemy();
    if (enemy.state === 'chase') {
      enemy.alertTimer -= dt;
      if (enemy.alertTimer <= 0) enemy.state = 'patrol';
    }

    let tx, tz, sp;
    if (enemy.state === 'chase') {
      tx = player.x; tz = player.z; sp = enemy.speed;
    } else {
      // 巡回：目標に着いたら次の地点へ
      if (Math.hypot(enemy.target.x - enemy.x, enemy.target.z - enemy.z) < 4) {
        enemy.target.x = enemy.x + (Math.random() - 0.5) * 120;
        enemy.target.z = enemy.z + (Math.random() - 0.5) * 120;
      }
      tx = enemy.target.x; tz = enemy.target.z; sp = enemy.speed * 0.4;
    }
    const ex = tx - enemy.x, ez = tz - enemy.z;
    const ed = Math.hypot(ex, ez) || 1;
    enemy.heading = Math.atan2(-ex, -ez);
    const lim = WORLD / 2 - 8;
    enemy.x = THREE.MathUtils.clamp(enemy.x + (ex / ed) * sp * dt, -lim, lim);
    enemy.z = THREE.MathUtils.clamp(enemy.z + (ez / ed) * sp * dt, -lim, lim);

    // 触れられたら即終了（敵は遠隔攻撃できない＝近接のみ）
    const dToPlayer = Math.hypot(player.x - enemy.x, player.z - enemy.z);
    if (dToPlayer < enemyMesh.userData.radius + 1.2) {
      player.hp = 0; player.alive = false;
      elHurt.style.opacity = '1';
      endGame(false);
    }
  }

  // 敵メッシュ配置（幽霊は浮遊）
  const egy = heightAt(enemy.x, enemy.z);
  const floatY = enemyMesh.userData.fly ? 2.4 + Math.sin(gameTime * 1.5) * 0.4 : 0;
  enemyMesh.position.set(enemy.x, egy + floatY, enemy.z);
  enemyMesh.rotation.y = enemy.heading;
  enemyMesh.visible = enemy.alive;

  // 太陽をプレイヤー追従で影を維持
  sun.position.set(player.x + 120, 200, player.z + 80);
  sun.target.position.set(player.x, 0, player.z);
  sun.target.updateMatrixWorld();

  // スコープ中心に敵が捉えられているか（赤→緑で表示）
  if (mode === 'scope' && enemy.alive) {
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const onTarget = raycaster.intersectObject(enemyMesh, true).length > 0;
    elScopeDot.style.background = onTarget ? '#36e04a' : '#e02020';
  }

  // ===== HUD =====
  const cd = RIFLE_COOLDOWN - (gameTime - lastShot);
  elRifle.textContent = cd > 0 ? `ライフル: 装填中 ${cd.toFixed(1)}s` : 'ライフル: 装填完了';
  elRifle.style.color = cd > 0 ? '#ffcf66' : '#9fe0a0';
  elHp.style.width = player.hp + '%';
  elHp.style.background = player.hp > 40 ? '#43c44a' : '#e04545';
  if (!enemy.alive) elStatus.textContent = `敵(${enemyLabel}): 討伐済`, elStatus.style.color = '#7fe08a';
  else if (enemy.state === 'chase') elStatus.textContent = `敵(${enemyLabel}): 追跡中！`, elStatus.style.color = '#ff6b6b';
  else elStatus.textContent = `敵(${enemyLabel}): 捜索中`, elStatus.style.color = '#ffffff';
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  update(dt);
  water.position.set(player.x, WATER_LEVEL + Math.sin(performance.now() * 0.001) * 0.05, player.z);
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
